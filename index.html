<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Memoir on Skin. Sample first, remember always. A fragrance journal for discovering, wearing and keeping your scents." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Memoir on Skin" />
    <title>Memoir on Skin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // The Railway address is only a backup. Send visitors to the real domain, keeping the path and query.
      (function () {
        try {
          if (location.hostname === 'scent-production-0443.up.railway.app') {
            location.replace('https://www.memoironskin.com' + location.pathname + location.search + location.hash);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('mos-theme');
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0F0B14' : '#FAF7F5');
        } catch (e) {}
      })();
    </script>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { width: 100%; height: 100%; background: #FAF7F5; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
      html[data-theme="dark"] { background: #0F0B14; color-scheme: dark; }
      body { width: 100%; height: 100%; background: transparent; }
      #root { width: 100%; min-height: 100svh; }
      input, button, textarea, select { font-family: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      img { max-width: 100%; display: block; }
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
